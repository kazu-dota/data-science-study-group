[project]
name = "data-science-study-group"
version = "0.1.0"
description = "Hands-on data science study group for pharmaceutical chemistry researchers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
]

[project.optional-dependencies]
chemistry = [
    "rdkit>=2025.3",
]
advanced = [
    "xgboost>=2.1",
    "optuna>=4.0",
]

[tool.uv]
package = false
